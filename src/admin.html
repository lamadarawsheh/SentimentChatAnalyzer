<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الدردشة</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <h2>دردشة العملاء</h2>
            </div>
            <div class="chat-messages" id="messages">
                <!-- Messages will be added here -->
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="اكتب الرسالة هنا...">
                <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        <div class="analytics-panel">
            <div class="chart-container">
                <canvas id="sentimentChart"></canvas>
            </div>
            <h3>تحليل المشاعر</h3>
            <div class="sentiment-stats">
                <div class="stat-item">
                    <div class="stat-icon positive"><i class="fas fa-smile"></i></div>
                    <span>إيجابي: <span id="positiveCount">0</span></span>
                </div>
                <div class="stat-item">
                    <div class="stat-icon neutral"><i class="fas fa-meh"></i></div>
                    <span>محايد: <span id="neutralCount">0</span></span>
                </div>
                <div class="stat-item">
                    <div class="stat-icon negative"><i class="fas fa-frown"></i></div>
                    <span>سلبي: <span id="negativeCount">0</span></span>
                </div>
            </div>
            <div class="recent-messages">
                <h4>آخر الرسائل</h4>
                <div id="recentAnalysis"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="socket.io/socket.io.js"></script>
    
    <script src="admin/admin.js"></script>
</body>
</html>
